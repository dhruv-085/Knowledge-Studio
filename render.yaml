services:
  - type: web
    name: leo-technical-assistant-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && pip install .
    startCommand: uvicorn rag_assistant.api:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: PYTHONPATH
        value: src
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_EMBEDDING_MODEL
        value: models/gemini-embedding-001
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
